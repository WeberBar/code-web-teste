<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiCode Hub — Code Lab (Palco &amp; Code Web)</title>
    <link rel="icon" type="image/svg+xml" href="/logo/pi-logo-light.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="hub-app" class="hub-app">
      <!-- TOP HEADER DO HUB-WEB -->
      <header class="hub-header">
        <div class="hub-header-left">
          <button
            id="btn-toggle-sidebar"
            class="icon-btn"
            title="Alternar menu lateral"
            aria-label="Alternar menu lateral"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
          <a href="#code" class="hub-logo-link" id="logo-home-link">
            <img src="/logo/picode-logo-light.svg" alt="PiCode" class="hub-logo" id="header-logo-img" />
          </a>
        </div>

        <!-- Badge Central do Header -->
        <div class="hub-header-center">
          <div class="header-page-pill" id="header-page-pill">
            <span id="header-page-label">Meus códigos</span>
          </div>
        </div>

        <div class="hub-header-right">
          <div class="school-selector">
            <span class="school-label">Escola</span>
            <select id="select-school" aria-label="Selecionar escola">
              <option value="Escola PiCode Maker">Escola PiCode Maker</option>
              <option value="Colégio Inovação">Colégio Inovação</option>
              <option value="Laboratório Maker">Laboratório Maker</option>
            </select>
          </div>

          <div class="header-divider"></div>

          <button class="icon-btn notification-btn" title="Notificações" aria-label="Notificações">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-dot"></span>
          </button>

          <button class="icon-btn logout-btn" title="Sair do sistema" aria-label="Sair do sistema">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- CORPO PRINCIPAL: SIDEBAR (Navbar) + CONTEÚDO DAS GUIAS -->
      <div class="hub-body">
        <aside id="hub-sidebar" class="hub-sidebar">
          <!-- 1. SEÇÃO DE PERFIL (idêntica ao Navbar/index.tsx) -->
          <div class="sidebar-profile-section">
            <button
              id="btn-collapse-sidebar"
              class="sidebar-collapse-btn"
              title="Recolher menu"
              type="button"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>

            <div class="sidebar-profile-row" data-tab-trigger="profile">
              <div class="sidebar-avatar-wrap">
                <img src="/avatars/blue-character.png" alt="Avatar" class="sidebar-avatar-img" />
                <span class="sidebar-camera-btn" title="Alterar foto">
                  <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                  </svg>
                </span>
              </div>

              <div class="sidebar-user-info">
                <div class="sidebar-user-name-row">
                  <span class="sidebar-user-name" id="sidebar-user-name">Weber</span>
                  <span class="sidebar-edit-icon" title="Editar Perfil">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                  </span>
                </div>
                <span class="sidebar-user-email">weber@picode.com.br</span>
                <div class="sidebar-coin-badge">
                  <img src="/icons/coin.svg" alt="Moedas" width="10" height="10" />
                  <span>1.250</span>
                </div>
              </div>
            </div>
          </div>

          <div class="sidebar-divider"></div>

          <!-- 2. MENU DE NAVEGAÇÃO COM ANIMAÇÃO STAGGER -->
          <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>

        <main class="hub-main" id="hub-main">
          <!-- GUIA CODE LAB: 2 Cards (Palco e Code Web) -->
          <section id="view-code-folders" class="tab-view active">
            <div class="internal-page-container">
              <div class="internal-page-header animate-header" id="code-page-header">
                <div class="internal-page-header-left">
                  <div class="internal-page-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="16 18 22 12 16 6"></polyline>
                      <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                  </div>
                  <div>
                    <h1 class="internal-page-title">Code Lab</h1>
                    <p class="internal-page-desc">Escolha o ambiente para programar em tela cheia</p>
                  </div>
                </div>
              </div>

              <!-- Grid com os 2 Cards: Palco e Code Web -->
              <div id="codelab-cards-grid" class="cards-grid"></div>
            </div>
          </section>

          <!-- GUIA HOME (Profile idêntico ao src/pages/profile/index.page.tsx) -->
          <section id="view-profile" class="tab-view">
            <div class="internal-page-container" id="profile-page-content"></div>
          </section>

          <!-- DEMAIS GUIAS DO HUB-WEB -->
          <section id="view-generic" class="tab-view">
            <div class="internal-page-container" id="generic-tab-content"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- =========================================================
         EDITOR CODE LAB EM TELA FULL (100vw x 100vh)
         Abre ao clicar no card do Palco ou no card do Code Web
         ========================================================= -->
    <div id="fullscreen-ide-overlay" class="fullscreen-ide-overlay">
      <!-- Botão de sair integrado no canto direito da MenuBar (48px) dos editores -->
      <div class="ide-top-right-controls">
        <button
          id="btn-exit-fullscreen-ide"
          class="ide-exit-btn"
          title="Voltar para o Hub Web"
          type="button"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Iframes ocupando 100vw x 100vh em tela cheia -->
      <div class="codelab-editor-stage">
        <iframe
          id="iframe-palco"
          class="codelab-iframe active"
          src="/iframes/palco/editor.html"
          title="PiCode Palco (Stage Mode)"
          allow="serial; camera; microphone; clipboard-read; clipboard-write; fullscreen"
        ></iframe>

        <iframe
          id="iframe-code"
          class="codelab-iframe"
          src="/iframes/code/editor.html"
          title="Code Web (Code Hub Upload Mode)"
          allow="serial; camera; microphone; clipboard-read; clipboard-write; fullscreen"
        ></iframe>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
