<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addon Settings</title><style>body[data-splash-theme="dark"] {
        background: #111;
      }

      noscript {
        font-family: "Outfit", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }</style></head><body><noscript><h1>This page requires JavaScript</h1></noscript><script>(function() {
        var theme = '';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        document.body.setAttribute('data-splash-theme', theme);
      })();</script><div id="app"></div><script src="js/pentapod/vendors~addon-settings~code-hub~credits~editor~embed~fullscreen~player.146c7ad2bf5d267139f7.js"></script><script src="js/pentapod/addon-settings~addons~code-hub~editor~fullscreen~player.408859216292eed87e9d.js"></script><script src="js/pentapod/addon-settings~code-hub~editor~embed~fullscreen~player.4b44cbcc8fdc168b3684.js"></script><script src="js/pentapod/addon-settings.bef9e898e47ac73503a6.js"></script></body></html>
